name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml pytest "git+https://github.com/github/spec-kit.git"
      - name: Offline checks
        run: ./scripts/validate.sh
      - name: Tests (guide-style, uses specify_cli.extensions.ExtensionManifest)
        run: python -m pytest -q tests
      - name: Version guard - content change under featureline-ext/ must bump extension.yml version
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --quiet "$BASE" HEAD -- featureline-ext featureline-workflow; then
            echo "no package changes"; exit 0; fi
          OLD=$(git show "$BASE:featureline-ext/extension.yml" | python3 -c "import sys,yaml;print(yaml.safe_load(sys.stdin)['extension']['version'])")
          NEW=$(python3 -c "import yaml;print(yaml.safe_load(open('featureline-ext/extension.yml'))['extension']['version'])")
          [ "$OLD" != "$NEW" ] || { echo "featureline-ext changed but version is still $OLD - bump it and CHANGELOG.md"; exit 1; }
          grep -q "## \[$NEW\]" CHANGELOG.md || { echo "CHANGELOG.md has no ## [$NEW] section"; exit 1; }
      - name: Real install with the Spec Kit CLI
        run: |
          mkdir /tmp/proj && cd /tmp/proj && git init -q
          specify init . --integration claude --ignore-agent-tools --non-interactive --force
          specify extension add --dev "$GITHUB_WORKSPACE/featureline-ext"
          specify extension list
          test -f .specify/extensions/featureline/featureline-config.template.yml
          specify workflow add --dev "$GITHUB_WORKSPACE/featureline-workflow"
          specify workflow info featureline
